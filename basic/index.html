<style>
/* The sign-in page of a login-protected build. The viewer itself is in
   this file only as ciphertext; see src/login-gate.js. */
:root{
  --brand:#00843D;
  --brand-deep:#03441F;
  --accent:#00843D;
  --brand-mid:#2E7D46;
  --red:#9E2A2F;
  --red-deep:#6E1D21;
  --green:#00843D;
  --purple:#007681;
  --grey:#8C9488;
  --bg:#F5F9ED;
  --panel:#FFFFFF;
  --panel-2:#EDF3E2;
  --ink:#101410;
  --ink-2:#5A625A;
  --line:#D3DCC8;
  --line-2:#E7EEDC;
  --hl:#F0F6E6;
  --sel:#DCEFC8;
  --head:#000000;
  --head-ink:#FFFFFF;
  --head-line:#00843D;
  --bar:#00843D;
  --bar-done:#03441F;
  --crit:#9E2A2F;
  --crit-done:#6E1D21;
  --lp:#FF7F4D;
  --group-bar:#03441F;
  --ms:#000000;
  --loe:#98A296;
  --bl:#D8C092;
  --bl-2:#A8916A;
  --dd:#007681;
  --today:#7C857B;
  --float:#C9D6BA;
  --link:#8D9A87;
  --link-drive:#9E2A2F;
  --nonwork:#E9F0DD;
  --gantt-bg:#FFFFFF;
  --ts-ink:#03441F;
  --hist-plan:#D8C092;
  --hist-remain:#8C9488;
  --add:#00843D;
  --del:#9E2A2F;
  --pass-bg:#DCEFC8;
  --pass-ink:#1F5B2B;
  --fail-bg:#F7DCDE;
  --fail-ink:#7A1D22;
  --warn-bg:#FFEFCE;
  --warn-ink:#7A4A17;
  --info-bg:#E7EEDC;
  --info-ink:#5A625A;
  --curve-pv:#03441F;
  --curve-fc:#007681;
  --curve-ev:#00843D;
  --curve-ac:#FF7F4D;
  --grp0:#CADCB4;
  --grp1:#D6E5C4;
  --grp2:#E1EDD3;
  --grp3:#EAF2E1;
  --grp4:#F1F7EA;
  --progress:#BDE588;
  --accent-ink:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --text-body:13px;
  --text-ui:12px;
  --text-secondary:11.5px;
  --text-small:11px;
  --text-caption:10.5px;
  --text-tick:10px;
  --text-glyph:9px;
  --text-emphasis:12.5px;
  --text-lead:14px;
  --text-title:17px;
  --text-brand:19px;
  --text-display:21px;
  --text-score:26px;
  --leading:1.35;
  --leading-loose:1.45;
  --weight-medium:500;
  --weight-semibold:600;
  --weight-bold:700;
  --brand-tracking:.06em;
  --caps-tracking:.4px;
  --caps-transform:uppercase;
  --space-1:4px;
  --space-2:6px;
  --space-3:8px;
  --space-4:10px;
  --space-5:12px;
  --space-6:14px;
  --space-7:16px;
  --space-8:22px;
  --space-9:26px;
  --space-10:30px;
  --control-h:28px;
  --control-h-sm:26px;
  --control-h-xs:22px;
  --control-h-lg:34px;
  --control-pad-x:8px;
  --control-radius:3px;
  --control-border:1px;
  --radius-sm:3px;
  --radius:4px;
  --radius-pill:8px;
  --shadow-card:0 8px 30px rgba(0,40,80,.14);
  --shadow-tip:0 6px 24px rgba(0,20,50,.22);
  --shadow-pop:0 10px 30px rgba(0,25,60,.24);
  --shadow-modal:0 20px 60px rgba(0,0,0,.35);
  --scrim:rgba(0,20,40,.55);
  --top-h:52px;
  --top-rule:3px;
  --hdr-h:46px;
  --hdr-rule:2px;
  --status-h:26px;
  --status-rule:2px;
  --card-rule:6px;
  --modal-rule:5px;
  --scrollbar:11px;
  --row-h:24px;
  --table-th-pad:5px 8px;
  --table-td-pad:4px 8px;
  --table-th-weight:600;
  --table-th-transform:none;
  --table-th-tracking:0;
  --focus-w:2px;
  --focus-style:solid;
  --focus-color:var(--accent);
  --focus-offset:1px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--text-body)/var(--leading) var(--sans);display:flex;flex-direction:column}
#top{min-height:var(--top-h);background:var(--head);border-bottom:var(--top-rule) solid var(--head-line);color:var(--head-ink);
  display:flex;align-items:center;padding:var(--space-2) var(--space-6);font:var(--weight-bold) var(--text-brand)/1 var(--sans)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-7)}
.card{background:var(--panel);border-top:var(--card-rule) solid var(--accent);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);
  padding:var(--space-10) 38px;width:400px;max-width:100%}
.card img{display:block;margin:0 auto var(--space-7);max-width:100%}
h1{margin:0 0 var(--space-2);font:var(--weight-bold) var(--text-display)/1.2 var(--sans);color:var(--brand);text-align:center}
.lead{margin:0 0 var(--space-7);color:var(--ink-2);text-align:center}
label{display:block;font-size:var(--text-ui);font-weight:var(--weight-semibold);margin:var(--space-5) 0 var(--space-1)}
input[type=text],input[type=password]{width:100%;height:34px;border:var(--control-border) solid var(--line);border-radius:var(--control-radius);
  background:var(--panel);color:var(--ink);padding:0 var(--space-4);font:inherit}
.chk{display:flex;align-items:center;gap:var(--space-2);font-weight:400;color:var(--ink-2);margin-top:var(--space-5)}
button{margin-top:var(--space-7);width:100%;height:var(--control-h-lg);border:none;border-radius:var(--control-radius);
  background:var(--brand);color:#fff;font:var(--weight-semibold) var(--text-body) var(--sans);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible{outline:var(--focus-w) var(--focus-style) var(--focus-color);outline-offset:var(--focus-offset)}
#msg{margin-top:var(--space-5);min-height:1em;font-size:var(--text-ui)}
#msg.err{background:var(--fail-bg);color:var(--fail-ink);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm)}
.ver{margin-top:var(--space-7);font-size:var(--text-small);color:var(--ink-2);text-align:center}
.hidden{display:none}
</style>
</head>

<div id="top">Cargill</div>

const BRAND_ID = "cargill-basic";
const STORE = "schedule-viewer:cargill-basic:login";

const $ = (id) => document.getElementById(id);
const area = (kind) => { try { return window[kind]; } catch (e) { return null; } };
function remembered() {
  for (const kind of ['sessionStorage', 'localStorage']) {
    const s = area(kind);
    const v = s && s.getItem(STORE);
    if (v) return v;
  }
  return '';
}
function forget() { for (const kind of ['sessionStorage', 'localStorage']) { const s = area(kind); try { if (s) s.removeItem(STORE); } catch (e) { /* ignore */ } } }
function keep(keyB64, always) {
  try { const s = area('sessionStorage'); if (s) s.setItem(STORE, keyB64); } catch (e) { /* ignore */ }
  if (always) { try { const s = area('localStorage'); if (s) s.setItem(STORE, keyB64); } catch (e) { /* ignore */ } }
}
// Replace this page with the viewer. The page must have finished loading
// first: a remembered login decrypts before the parser is done, and a
// document.open() then does not replace the page but writes the viewer
// into it, so the sign-in page's styles and ids stay underneath.
function whenLoaded() {
  return document.readyState === 'complete' ? Promise.resolve()
    : new Promise((ok) => window.addEventListener('load', () => setTimeout(ok, 0), { once: true }));
}
async function launch(html) { await whenLoaded(); document.open(); document.write(html); document.close(); }
function say(text, err) { const m = $('msg'); m.textContent = text; m.className = err ? 'err' : ''; }

async function start() {
  const saved = remembered();
  if (saved) {
    let html = null;
    try { html = await openSealed(b64ToBytes(saved), SEALED); } catch (e) { forget(); }
    if (html !== null) { await launch(html); return; }
  }
  $('signin').classList.remove('hidden');
  $('user').focus();
}

$('signin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const go = $('go');
  go.disabled = true; go.textContent = 'Signing in…'; say('');
  try {
    const key = await deriveLoginKey(BRAND_ID, $('user').value, $('pass').value, SEALED.iter);
    let html;
    try { html = await openSealed(key, SEALED); } catch (e) { html = null; }
    if (html === null) {
      say('That username and password do not match.', true);
      $('pass').value = ''; $('pass').focus();
      return;
    }
    keep(bytesToB64(key), $('keep').checked);
    await launch(html);
    return;
  } catch (e) {
    say(e && e.message ? e.message : String(e), true);
  } finally {
    if (document.getElementById('go')) { go.disabled = false; go.textContent = 'Sign in'; }
  }
});

start();
})();
</script>
